name: Build Peel APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Unpack and build
        run: |
          unzip -q peel-project.zip -d src
          cd src
          gradle assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp src/app/build/outputs/apk/debug/app-debug.apk Peel.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: peel-${{ github.run_number }}
          name: Peel build ${{ github.run_number }}
          files: Peel.apk
